name: Report a bug
description: Something does not work, prints wrong, or LabelAxis stopped.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. For a security problem, please use **Security › Report a vulnerability** instead of an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: "I printed a sheet of Formtec 3100 labels and every label was 2 mm too low."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. File › New Project › Formtec 3100
        2. Add a barcode
        3. Print
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LabelAxis version
      description: Help › About LabelAxis.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How LabelAxis is installed
      options:
        - Installer
        - Offline installer
        - Portable zip
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer and label sheet (for printing problems)
      placeholder: "Brother HL-L2350DW, Formtec 3100"
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [English, العربية, کوردی, فارسی, Français, Español, Nederlands, Русский, 简体中文, हिन्दी]
  - type: textarea
    id: files
    attributes:
      label: Files that help
      description: |
        Drag in a screenshot, a small .labelproj file (zip it first), or the crash log:
        %LOCALAPPDATA%\LabelAxis\logs\crash.log (portable version: Data\logs beside LabelAxis.exe).
        Remove anything private first.
